name: Vajra MCP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install psutil aiofiles pytest pytest-asyncio ruff

    - name: Lint code
      run: |
        # Run ruff check for fast linting
        ruff check src/

    - name: Run test suite
      run: |
        python -c "import sys, traceback; sys.path.insert(0, 'src');
try:
    import cybermcp.server
    print('SERVER IMPORT OK')
except Exception:
    tb = traceback.format_exc().replace('\n', '%0A')
    print(f'::error title=ServerImportError::{tb}')
    sys.exit(1)"
        python -m unittest discover tests -v
