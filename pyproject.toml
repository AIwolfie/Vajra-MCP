[project]
name = "vajra-mcp"
version = "1.0.0"
description = "Vajra MCP - precise, resilient MCP execution backend for Claude Code security workflows"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "weasyprint>=60.0",
]

[project.scripts]
cybermcp = "cybermcp.__main__:main"
vajra-mcp = "cybermcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybermcp"]
